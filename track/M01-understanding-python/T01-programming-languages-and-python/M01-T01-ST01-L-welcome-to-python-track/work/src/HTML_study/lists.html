<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Lists</h1>
    <!-- Ordered List -->
    <ol>
        <li>Dosa</li>
        <li>Dosa</li>
        <li>Dosa</li>
        <li>Dosa</li>
    </ol>
    <!-- Unordered List -->
    <ul>
        <li>Dosa</li>
        <li>Dosa</li>
        <li>Dosa</li>
        <li>Dosa</li>
    </ul>
    <!-- Description List -->
    <dl>
        <dt>HTLM</dt>
        <dd>HyperTextMarkupLanguage</dd>
    </dl>
    <!-- nested list -->
    <ul>
        <li>Noodles</li>
        <ol>
            <li>Chilli Noodles</li>
            <dl>
                <dt>Price</dt>
                <dd>100</dd>
            </dl>
            <li>Schewan Noodles</li>
            <li>Manchurian Noodles</li>
        </ol>
        <li>Fried rice</li>
        <li>Paneer tikka</li>
        <li>Manchurian</li>
        <li>Chilli chicken</li>
    </ul>
</body>

</html>
