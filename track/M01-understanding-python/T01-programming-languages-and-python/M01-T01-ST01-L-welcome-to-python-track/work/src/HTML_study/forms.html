<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>
    <h1>Captcha Form</h1>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
            <label for="captcha">Enter Captcha <span style="color: red;">*</span> :</label>
            <input type="text" id="captcha" name="captcha" placeholder="Enter the captcha here"
                title="Captcha should be in 6 characters" required autocomplete="off">
            <br> <br>
            <label for="email">Email : </label>
            <input type="email" id="email" name="email" placeholder="Enter your email" title="Enter valid email">
            <br> <br>
            <input type="file" accept=".jpg,.png,.pdf">
            <input type="number" min="1" max="150">
            <br><br>
            <!-- radio button -->
            <label>
                <input type="radio" name="gender" value="male"> Male
            </label>
            <label>
                <input type="radio" name="gender" value="female"> Female
            </label>
            <!-- Checkbox -->
            <label>
                <input type="checkbox" name="option" value="Option 1"> Option 1
            </label>
            <label>
                <input type="checkbox" name="option" value="Option 2"> Option 2
            </label>
            <br><br>
        </fieldset>
        <br>
        <!-- textarea -->
        <label for="comments">Your Comments:</label>
        <textarea id="comments" name="comments" rows="4" cols="50">
            Enter your comments here...
        </textarea>
        <br> <br>
        <input type="submit" value="   Ok      ">
        <button type="reset">Reset</button>
    </form>
</body>

</html>
